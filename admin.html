<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Fabula Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#090C18;--bg2:#0E1326;--card:#121831;--card2:#171E3B;--line:rgba(255,255,255,.09);--tx:#E9ECF7;--tx2:#B7BED8;--tx3:#8B93B5;--acc:#FFC566;--green:#7EE0B5;--red:#FF8A7A;--disp:'Bricolage Grotesque',sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;font-size:15px}
a{color:var(--acc);text-decoration:none}
button,input,select,textarea{font-family:inherit;font-size:15px}
img{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid transparent;font-weight:700;cursor:pointer;transition:filter .2s,transform .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.b-acc{background:var(--acc);color:#1A1206}
.b-ghost{background:rgba(255,255,255,.05);border-color:var(--line);color:var(--tx)}
.b-red{background:rgba(255,138,122,.12);border-color:rgba(255,138,122,.4);color:#FFB4A8}
.b-icon{width:40px;min-height:40px;padding:0;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--tx2)}
.ico{width:18px;height:18px;flex:none}
.disp{font-family:var(--disp);letter-spacing:-.02em}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:28px 28px}
.lbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:18px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.lbox h1{margin:0;font-family:var(--disp);font-size:28px;color:#fff}
.err{color:#FFB4A8;font-size:14px;min-height:18px}

/* layout */
#app{display:none;min-height:100vh}
.side{position:fixed;left:0;top:0;bottom:0;width:240px;background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;z-index:10}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;color:#fff}
.brand b{font-family:var(--disp);font-weight:800;font-size:20px;display:block;line-height:1}
.brand small{color:var(--tx3);font-size:11px;font-weight:700;letter-spacing:.2em}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;color:var(--tx2);font-weight:600;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:rgba(255,255,255,.04);color:#fff}
.nav.on{background:rgba(255,197,102,.12);color:var(--acc)}
.nav .cnt{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--tx2)}
.side .sp{flex:1}
.who{font-size:13px;color:var(--tx3);padding:8px 14px;word-break:break-all}
main{margin-left:240px;padding:32px clamp(16px,4vw,48px) 80px;max-width:1200px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
.top h1{margin:0;font-family:var(--disp);font-weight:800;font-size:34px;color:#fff}
.top p{margin:4px 0 0;color:var(--tx3)}
.mob{display:none}
@media(max-width:860px){
  .side{transform:translateX(-100%);transition:transform .25s}
  .side.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.6)}
  main{margin-left:0;padding-top:76px}
  .mob{display:flex;position:fixed;top:0;left:0;right:0;z-index:9;align-items:center;gap:12px;padding:12px 16px;background:rgba(14,19,38,.95);border-bottom:1px solid var(--line)}
}

.demo{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;padding:14px 18px;border-radius:14px;background:#2A2110;border:1px solid rgba(255,197,102,.35);color:#FFE2A8;font-size:14px;margin-bottom:24px}

/* lista */
.list{display:flex;flex-direction:column;gap:12px}
.item{display:flex;align-items:center;gap:16px;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:border-color .2s}
.item:hover{border-color:rgba(255,255,255,.18)}
.thumb{width:96px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:#1A2142;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:13px;text-align:center;padding:4px;overflow:hidden}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.info b{font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;background:rgba(255,255,255,.07);color:var(--tx2)}
.m-gratis{background:#7EE0B5;color:#06261A}.m-doacao{background:#FFC566;color:#1A1206}.m-pago{background:#C9A4FF;color:#1E0F3A}
.acts{display:flex;align-items:center;gap:6px;flex:none}
.hide{opacity:.5}
@media(max-width:600px){.item{flex-wrap:wrap}.thumb{width:72px;height:52px}.acts{width:100%;justify-content:flex-end}}
.empty{padding:48px;text-align:center;color:var(--tx3);border:1px dashed var(--line);border-radius:18px}

/* switch */
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:999px;background:rgba(255,255,255,.14);transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked + span{background:var(--green)}
.sw input:checked + span:after{transform:translateX(20px)}
.sw input:focus-visible + span{outline:2px solid var(--acc);outline-offset:2px}

/* editor */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.ov.open{display:block}
.ed{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease}
.ed.open{transform:none}
.ed-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line)}
.ed-h h2{margin:0;font-family:var(--disp);font-size:24px;color:#fff}
.ed-b{flex:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:22px}
.ed-f{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;padding:16px 24px;border-top:1px solid var(--line);background:var(--bg2)}
fieldset{border:1px solid var(--line);border-radius:18px;padding:18px;margin:0;display:flex;flex-direction:column;gap:16px}
legend{padding:0 8px;color:var(--acc);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.f{display:flex;flex-direction:column;gap:7px}
.f > span{font-size:13px;font-weight:600;color:var(--tx2)}
.f small{color:var(--tx3);font-size:12px}
.f input[type=text],.f input[type=url],.f input[type=email],.f input[type=password],.f input[type=date],.f input[type=number],.f select,.f textarea{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:var(--bg);color:#fff}
.f textarea{min-height:96px;resize:vertical;line-height:1.5}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative}
.chips input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.chips span{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.16);color:var(--tx2);font-weight:600;font-size:14px;transition:.2s}
.chips input:checked + span{background:rgba(255,197,102,.15);border-color:var(--acc);color:#FFE2A8}
.chips input:focus-visible + span{outline:2px solid var(--acc)}
.colors{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.colors button{width:36px;height:36px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.colors button.on{border-color:#fff}
.colors input[type=color]{width:44px;height:38px;border:0;background:none;padding:0;cursor:pointer}
.up{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.up .pv{width:140px;height:90px;border-radius:12px;object-fit:cover;background:#1A2142;border:1px dashed rgba(255,255,255,.2)}
.up .pv.sq{width:80px;height:80px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gi{border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.gi img{width:100%;height:110px;object-fit:cover}
.gi .gb{padding:8px;display:flex;flex-direction:column;gap:6px}
.gi input{width:100%;min-height:38px;padding:6px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:var(--bg);color:#fff;font-size:13px}
.gi .ga{display:flex;gap:4px;justify-content:space-between}
.gi .ga button{width:34px;min-height:34px}
.chk{display:flex;align-items:center;gap:12px;font-weight:600;color:var(--tx)}

/* preview */
.prev{border-radius:20px;overflow:hidden;background:var(--card);border:1px solid var(--line);max-width:320px}
.prev .pi{position:relative;height:160px;background:#1A2142}
.prev .pi img{width:100%;height:100%;object-fit:cover}
.prev .pi .art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:26px;text-align:center;padding:12px;background-size:20px 20px}
.prev .bdg{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;text-transform:uppercase}
.prev .pb{padding:18px;display:flex;flex-direction:column;gap:8px}
.prev small{color:var(--tx3);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.prev b{font-family:var(--disp);font-size:21px;color:#fff}
.prev p{margin:0;color:var(--tx2);font-size:14px;line-height:1.5}

table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
th{color:var(--tx3);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);z-index:50;padding:14px 20px;border-radius:14px;background:#1E2649;border:1px solid var(--line);color:#fff;font-weight:600;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:rgba(255,138,122,.5);color:#FFB4A8}
</style>
</head>
<body>

  <form class="lbox" id="lform">

  function openPost(p) {
    curType = 'posts';
    cur = p ? JSON.parse(JSON.stringify(p)) : { titulo: '', tag: 'Atualização', data: new Date().toISOString().slice(0, 10), resumo: '', imagem: '', link: '', visivel: true };
    var c = cur;
    openEd(p ? 'Editar novidade' : 'Nova novidade',
      '<fieldset><legend>Conteúdo</legend>' +
      '<label class="f"><span>Título *</span><input type="text" name="titulo" value="' + esc(c.titulo) + '" required></label>' +
      '<div class="g2"><label class="f"><span>Tipo</span><select name="tag">' + TAGS.map(function (t) { return '<option' + (c.tag === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></label>' +
      '<label class="f"><span>Data</span><input type="date" name="data" value="' + esc(c.data) + '"></label></div>' +
      '<label class="f"><span>Resumo</span><textarea name="resumo">' + esc(c.resumo) + '</textarea></label>' +
      '<label class="f"><span>Link para o texto completo (opcional)</span><input type="url" name="link" value="' + esc(c.link) + '" placeholder="https://... (itch.io, Instagram, YouTube)"></label>' +
      '<div class="f"><span>Imagem</span><div class="up"><img class="pv" id="pvImg" alt="" src="' + esc(c.imagem) + '"' + (c.imagem ? '' : ' style="visibility:hidden"') + '><span class="btn b-ghost filebtn">' + I.img + 'Escolher<input type="file" accept="image/*" id="fImg"></span><button type="button" class="btn b-icon" id="rmImg" aria-label="Remover imagem">' + I.del + '</button></div></div>' +
      '<label class="chk"><span class="sw"><input type="checkbox" name="visivel"' + (c.visivel !== false ? ' checked' : '') + '><span></span></span>Mostrar no site</label>' +
      '</fieldset>', !!p);
    $('fImg').onchange = function () { pickUpload(this, function (u) { cur.imagem = u; $('pvImg').src = u; $('pvImg').style.visibility = ''; }); };
    $('rmImg').onclick = function () { cur.imagem = ''; $('pvImg').style.visibility = 'hidden'; };
  }
  function readPost() {
    var B = $('edBody');
    ['titulo', 'tag', 'data', 'resumo', 'link'].forEach(function (k) { cur[k] = String(B.elements[k].value).trim(); });
    cur.visivel = B.elements.visivel.checked;
  }

  /* ---------------- salvar / excluir ---------------- */
  $('edSave').onclick = async function () {
    if (curType === 'jogos') readGame(); else readPost();
    if (!cur.titulo) { toast('Preencha o nome/título', true); $('edBody').elements.titulo.focus(); return; }
    var btn = this; busy(btn, true);
    try {
      if (curType === 'jogos' && cur.em_destaque) {
        var others = jogos.filter(function (g) { return g.em_destaque && g.id !== cur.id; });
        await Promise.all(others.map(function (g) { g.em_destaque = false; return FB.save('jogos', g); }));
      }
      await FB.save(curType, cur);
      toast('Salvo! Já está no site.'); closeEd(); await reload(); render();
    } catch (err) { toast('Erro ao salvar: ' + err.message, true); }
    busy(btn, false);
  };
  $('edDel').onclick = async function () {
    if (!cur || !cur.id) return;
    if (!confirm('Excluir "' + (cur.titulo || '') + '"? Isso não pode ser desfeito.')) return;
    try { await FB.remove(curType, cur.id); toast('Excluído'); closeEd(); await reload(); render(); }
    catch (err) { toast('Erro ao excluir: ' + err.message, true); }
  };

  start();
})();
</script>
</body>
</html>
