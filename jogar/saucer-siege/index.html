<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>Saucer Siege · Fabula Studio</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1b2a4a;font-family:"Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
canvas{display:block;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none}
.hud>*{pointer-events:auto}
.pill{background:rgba(20,30,60,.72);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
#stats{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap}
#topr{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px}
.btn{border:none;cursor:pointer;font:inherit;font-weight:900;color:#fff;border-radius:16px;padding:10px 16px;background:#4f7cff;box-shadow:0 4px 0 #2f4fb8;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2f4fb8}
.btn.round{width:46px;height:46px;padding:0;border-radius:50%;font-size:19px;background:rgba(20,30,60,.8);box-shadow:0 3px 0 rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.14)}
.btn.green{background:#2fbf71;box-shadow:0 4px 0 #1d8a4f}
.btn.orange{background:#ff8a3d;box-shadow:0 4px 0 #c45f1b}
.btn.red{background:#ef5a6f;box-shadow:0 4px 0 #b13447}
.btn:disabled{filter:grayscale(.8) brightness(.8);cursor:default}
#wavebtn{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font-size:18px;padding:14px 20px;border-radius:20px}
#wavebtn small{display:block;font-size:12px;opacity:.85;font-weight:700}
#panel{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(20,30,60,.86);backdrop-filter:blur(8px);border:2px solid rgba(255,255,255,.14);border-radius:22px;padding:10px;display:none;gap:8px;align-items:stretch;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:calc(100vw - 20px)}
#panel.show{display:flex}
.card{width:96px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);padding:6px 4px;text-align:center;cursor:pointer;position:relative}
.card img{width:64px;height:64px;display:block;margin:0 auto}
.card b{display:block;font-size:13px}
.card span{font-size:13px;font-weight:800;color:#ffd34d}
.card.off{opacity:.45}
.card.lock::after{content:"🔒 Fase 2";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,35,.7);border-radius:14px;font-size:12px;font-weight:800}
.card:active{transform:scale(.96)}
.tinfo{display:flex;gap:10px;align-items:center;padding:0 4px}
.tinfo img{width:64px;height:64px}
.tinfo h3{margin:0;font-size:17px}
.tinfo p{margin:2px 0 0;font-size:12.5px;opacity:.85;line-height:1.35}
.tbtns{display:flex;flex-direction:column;gap:6px;justify-content:center}
.tbtns .btn{padding:8px 12px;font-size:14px}
.x{position:absolute;top:-12px;right:-12px;width:30px;height:30px;border-radius:50%;border:none;background:#ef5a6f;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #b13447}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(60,90,170,.55),rgba(12,18,40,.92));z-index:10;padding:20px}
.screen.show{display:flex}
.logo{font-size:clamp(40px,8vw,78px);font-weight:900;letter-spacing:-1px;line-height:.95;text-shadow:0 5px 0 #2f4fb8,0 10px 24px rgba(0,0,0,.4)}
.logo em{font-style:normal;color:#ffd34d}
.sub{opacity:.8;font-weight:700;margin:10px 0 22px;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.levels{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lvl{width:170px;border-radius:22px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.16);padding:14px 10px;cursor:pointer;transition:transform .12s}
.lvl:hover{transform:translateY(-3px)}
.lvl h4{margin:4px 0 2px;font-size:18px}
.lvl .n{font-size:13px;opacity:.7;font-weight:800}
.lvl .st{font-size:22px;letter-spacing:2px;margin-top:6px}
.lvl.locked{opacity:.45;cursor:default}
.big{font-size:44px;font-weight:900;margin:0 0 6px}
.stars{font-size:52px;letter-spacing:6px;margin:6px 0 14px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.help{font-size:13px;opacity:.75;max-width:520px;margin-top:20px;line-height:1.5}
#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font-weight:900;font-size:15px;color:#ffd34d;text-shadow:0 2px 0 rgba(0,0,0,.5);animation:pop .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes pop{to{transform:translate(-50%,-180%);opacity:0}}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(20,30,60,.9);padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;white-space:nowrap}
#toast.show{opacity:1}
#banner{position:fixed;top:38%;left:0;right:0;text-align:center;font-size:clamp(28px,6vw,52px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .3s}
#banner.show{opacity:1}
#load{position:fixed;inset:0;background:#1b2a4a;display:flex;align-items:center;justify-content:center;z-index:20;font-weight:900;font-size:20px}
@media (max-height:430px){.card{width:84px}.card img{width:52px;height:52px}.pill{font-size:15px;padding:5px 11px}.btn.round{width:40px;height:40px;font-size:17px}#wavebtn{padding:10px 16px;font-size:16px}}
</style>
</head>
<body>
<div id="load">Carregando…</div>
<div class="hud" id="hud" style="display:none">
  <div id="stats">
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill">❤️ <span id="lives">20</span></div>
    <div class="pill">🛸 <span id="wave">0/0</span></div>
  </div>
  <div id="topr">
    <button class="btn round" id="spd" title="Velocidade">1×</button>
    <button class="btn round" id="snd" title="Som">🔊</button>
    <button class="btn round" id="pau" title="Pausar" style="font-size:14px;letter-spacing:-2px">❚❚</button>
  </div>
  <button class="btn green" id="wavebtn">▶ Onda 1</button>
  <div id="panel"></div>
</div>
<div id="pops"></div>
<div id="toast"></div>
<div id="banner"></div>

<div class="screen" id="menu">
  <div class="logo">Saucer<br><em>Siege</em></div>
  <div class="sub">Fabula Studio · v0.1</div>
  <div class="levels" id="levels"></div>
  <div class="help">Toque num quadrado de grama para construir torres. Toque numa torre para melhorar ou vender. Não deixe os óvnis chegarem ao castelo!</div>
</div>
<div class="screen" id="pause">
  <div class="big">Pausado</div>
  <div class="row" style="margin-top:12px">
    <button class="btn green" id="resume">▶ Continuar</button>
    <button class="btn orange" id="restart">↻ Reiniciar</button>
    <button class="btn red" id="quit">☰ Fases</button>
  </div>
</div>
<div class="screen" id="end">
  <div class="big" id="endT">Vitória!</div>
  <div class="stars" id="endS">★★★</div>
  <div id="endP" style="opacity:.85;font-weight:700;margin-bottom:16px"></div>
  <div class="row">
    <button class="btn green" id="next">Próxima fase ▶</button>
    <button class="btn orange" id="again">↻ Jogar de novo</button>
    <button class="btn" id="tomenu">☰ Fases</button>
  </div>
</div>

<script src="three.min.js"></script>
<script src="GLTFLoader.js"></script>
<script src="models.js"></script>
<script src="game.js"></script>
</body>
</html>
