<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Harvest Hollow · Fabula Studio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd16a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#3b2a14;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font-weight:800;font-size:15px;will-change:transform;text-align:center}
.lb .bub{display:inline-block;background:#fff;border:2px solid #7a5a2b;border-radius:14px;padding:2px 8px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.lb .bub.go{background:#fff7c2;animation:bob .7s ease-in-out infinite alternate}
.lb .bub.lock{background:#f2e3c2;font-size:13px}
.lb .bar{width:44px;height:8px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden;border:1px solid rgba(255,255,255,.7)}
.lb .bar i{display:block;height:100%;background:#6fd84a}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.float{position:absolute;left:0;top:0;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 #5a3c12,0 0 4px #5a3c12;pointer-events:none;white-space:nowrap}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.pill{background:#fff8e6;border:3px solid #7a5a2b;border-radius:18px;padding:4px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.25);display:flex;align-items:center;gap:6px}
.tog{pointer-events:auto;font-size:17px;padding:4px 10px}.tog.off{opacity:.4;text-decoration:line-through}
.xp{width:70px;height:9px;background:#e2d2ad;border-radius:5px;overflow:hidden}
.xp i{display:block;height:100%;background:#ffb300;width:0}
#btns{position:fixed;right:8px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.fab{width:62px;height:62px;border-radius:18px;border:3px solid #7a5a2b;background:#ffd35a;font-size:26px;box-shadow:0 4px 0 #a8791f;position:relative;padding:0;line-height:1}
.fab small{display:block;font-size:10px;font-weight:800;color:#3b2a14}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 #a8791f}
.dot{position:absolute;top:-6px;right:-6px;background:#e53935;color:#fff;border-radius:10px;min-width:20px;height:20px;font-size:12px;font-weight:800;line-height:20px;display:none}
#seedbar{position:fixed;left:8px;right:84px;bottom:max(10px,env(safe-area-inset-bottom));background:#fff8e6;border:3px solid #7a5a2b;border-radius:18px;padding:6px;display:none;gap:6px;overflow-x:auto;box-shadow:0 4px 0 rgba(0,0,0,.25);align-items:stretch}
.seed{flex:0 0 auto;min-width:74px;border:2px solid #c9a96a;border-radius:12px;background:#fff;padding:4px 6px;text-align:center;font-weight:800;font-size:12px;color:#3b2a14}
.seed b{display:block;font-size:24px;line-height:1.1}
.seed.sel{background:#d7f5b8;border-color:#4c9a2a}
.seed.off{opacity:.45}
.seed.x{min-width:40px;background:#f6d6d0;font-size:18px;display:flex;align-items:center;justify-content:center}
#modal{position:fixed;inset:0;background:rgba(40,25,5,.5);display:none;align-items:center;justify-content:center;padding:10px}
#card{background:#fff8e6;border:4px solid #7a5a2b;border-radius:22px;width:min(520px,100%);max-height:92%;display:flex;flex-direction:column;box-shadow:0 8px 0 rgba(0,0,0,.3)}
#card h2{margin:0;padding:10px 14px;font-size:19px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px dashed #d9c08a}
#card h2 button{border:none;background:#e57373;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;font-weight:900}
#body{overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #e2cf9f;border-radius:14px;padding:8px 10px;margin-bottom:8px}
.row .ic{font-size:30px;width:40px;text-align:center}
.row .tx{flex:1;font-size:13px;line-height:1.3}
.row .tx b{font-size:15px}
.bt{border:none;border-radius:12px;background:#58b947;color:#fff;font-weight:800;font-size:13px;padding:9px 10px;box-shadow:0 3px 0 #387a2c;white-space:nowrap}
.bt.alt{background:#ffb300;box-shadow:0 3px 0 #b27d00}
.bt.red{background:#e57373;box-shadow:0 3px 0 #a94442}
.bt:disabled{background:#bdbdbd;box-shadow:0 3px 0 #8d8d8d}
.sub{font-size:12px;opacity:.75;margin:4px 2px 10px}
.need{display:inline-block;margin-right:8px;font-weight:800}
.need.ok{color:#2e7d32}.need.no{color:#c62828}
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
.toast{background:rgba(59,42,20,.92);color:#fff;border-radius:14px;padding:7px 14px;font-weight:700;font-size:14px;text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
#load{position:fixed;inset:0;background:#8fd16a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:22px;color:#2f5d1c}
#load .bar{width:220px;height:16px;background:#fff;border:3px solid #2f5d1c;border-radius:10px;overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:#ffb300}
.lb .bub.sm{font-size:13px;padding:1px 6px}
.lb .bub.big{font-size:26px;background:#ffeb3b;border-color:#c62828}
#fishbar{position:fixed;left:8px;right:84px;bottom:max(10px,env(safe-area-inset-bottom));background:#e3f6ff;border:3px solid #2d6b8a;border-radius:18px;padding:8px;display:none;gap:8px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#fishbar .fx{flex:1;font-size:14px;font-weight:700;color:#1d4558}
.bt.big{font-size:17px;padding:12px 16px}.bt.big.off{background:#8fb8c9;box-shadow:0 3px 0 #5d8597}
.done{font-size:24px;padding:0 8px}
.row.chest{background:#fff3cf;border-color:#e0b84f}
#tut{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 46px);transform:translateX(-50%);background:#2f5d1c;color:#fff;border:3px solid #fff;border-radius:16px;padding:7px 14px;font-weight:800;font-size:14px;text-align:center;max-width:92%;display:none;box-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:none}
body.tuton #toasts{top:112px}
#hand{position:fixed;left:0;top:0;display:none;pointer-events:none;font-size:40px;line-height:1;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
#hand::before{content:"👇";display:block;transform:translate(-50%,-100%);animation:poke .6s ease-in-out infinite alternate}
#hand.side::before{content:"👉";transform:translate(-100%,-50%);animation:pokex .6s ease-in-out infinite alternate}
@keyframes poke{from{transform:translate(-50%,-115%)}to{transform:translate(-50%,-95%)}}
@keyframes pokex{from{transform:translate(-115%,-50%)}to{transform:translate(-95%,-50%)}}
#day{font-size:17px;padding:4px 10px}
@media (max-height:420px){.fab{width:54px;height:54px;font-size:22px}#btns{gap:6px}}
#rotate{position:fixed;inset:0;background:#2f5d1c;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:900;font-size:20px;text-align:center;padding:20px;z-index:50}
#rotate .ph{font-size:64px;animation:rot 1.6s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
.pill.tog{position:relative}
#placebar{position:fixed;left:8px;right:84px;bottom:max(10px,env(safe-area-inset-bottom));background:#fff3cf;border:3px solid #a8791f;border-radius:18px;padding:8px;display:none;gap:6px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#placebar .fx{flex:1;font-size:14px;font-weight:700}
#rainbow{position:fixed;left:50%;top:0;width:150vmax;height:150vmax;transform:translate(-50%,-71%);border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,transparent 60%,rgba(176,107,255,.26) 60.5%,rgba(91,107,255,.26) 61.5%,rgba(77,195,255,.26) 62.5%,rgba(91,227,107,.26) 63.5%,rgba(255,225,77,.26) 64.5%,rgba(255,159,67,.26) 65.5%,rgba(255,77,77,.26) 66.5%,transparent 67.5%)}
.wheelbox{position:relative;width:220px;height:220px;margin:4px auto}
#body .bar{display:inline-block;vertical-align:middle;width:90px;height:9px;background:#e2d2ad;border-radius:5px;overflow:hidden;margin:0 4px}
#body .bar i{display:block;height:100%;background:#58b947}
.wheelbox .ptr{position:absolute;left:50%;top:-10px;transform:translateX(-50%);font-size:26px;color:#c62828;z-index:2;text-shadow:0 2px 0 #fff}
.wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #7a5a2b;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.wheel span{position:absolute;left:50%;top:50%;font-weight:900;font-size:14px;white-space:nowrap;color:#3b2a14}
.wheel::after{content:"";position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:#fff8e6;border:4px solid #7a5a2b}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:6px 0}
.day{background:#fff8e6;border:2px solid #e0c48a;border-radius:10px;padding:5px 2px;text-align:center;font-size:12px;position:relative;min-height:62px}
.day small{display:block;font-weight:700;opacity:.7}.day b{display:block;margin-top:4px;font-size:13px;line-height:1.15}
.day.got{opacity:.55}.day.got i{position:absolute;right:2px;top:1px;font-style:normal;font-size:12px}
.day.now{border-color:#58b947;background:#e7f8d9;box-shadow:0 0 0 3px #b6f0a0;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
#load img{width:120px;height:120px;border-radius:28px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
#load .tip{font-size:14px;font-weight:700;opacity:.8;max-width:80%;text-align:center}
.vol{width:100%;margin-top:6px;accent-color:#58b947;height:26px}
.vv{min-width:44px;text-align:right;font-weight:800}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rainbow"></div>
<div id="labels"></div>
<div id="top">
  <div class="pill">💰 <span id="coins">0</span></div>
  <div class="pill">⭐ <span id="lvl">1</span><div class="xp"><i id="xpbar"></i></div></div>
  <div class="pill">📦 <span id="stor">0/0</span></div>
  <div class="pill" id="day">☀️</div>
  <button class="pill tog" id="bMenu" style="margin-left:auto">☰<span class="dot" id="dotMenu"></span></button>
  <button class="pill tog" id="bMus">🎵</button>
  <button class="pill tog" id="bSfx">🔊</button>
</div>
<div id="btns">
  <button class="fab" data-open="orders">🚚<small>Pedidos</small><span class="dot" id="dotOrders"></span></button>
  <button class="fab" data-open="barn">📦<small>Celeiro</small></button>
  <button class="fab" data-open="missions">📅<small>Missões</small><span class="dot" id="dotMis"></span></button>
  <button class="fab" id="fabShop" data-open="shop">🛒<small>Loja</small></button>
</div>
<div id="seedbar"></div>
<div id="fishbar"></div>
<div id="placebar"></div>
<div id="tut"></div>
<div id="hand"></div>
<div id="toasts"></div>
<div id="modal"><div id="card"><h2><span id="ttl"></span><button id="close">✕</button></h2><div id="body"></div></div></div>
